<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annie Besant National School - Rangoli Setup</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffb347, #ffcc33);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      padding: 30px;
      text-align: center;
      width: 90%;
      max-width: 500px;
    }
    img.logo {
      width: 100px;
      margin-bottom: 15px;
    }
    h1 {
      margin: 5px 0;
      color: #b22222;
    }
    input {
      display: block;
      margin: 10px auto;
      width: 90%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      margin-top: 20px;
      background: #ff6600;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    footer {
      margin-top: 20px;
      font-size: 13px;
      color: #fff;
    }
  </style>
</head>
<body>
  <img src="hmm.png" class="logo" alt="School Logo">
  <h1>Annie Besant National School</h1>
  <h3>Rangoli Competition 2025</h3>

  <div class="container">
    <h2>Enter Rangoli Names (9)</h2>
    <div id="inputs"></div>
    <button onclick="saveNames()">Continue to Voting</button>
  </div>

  <footer>Powered by ARYAN</footer>

  <script>
    const inputDiv = document.getElementById('inputs');
    for(let i=1; i<=9; i++){
      inputDiv.innerHTML += `<input id="rangoli${i}" placeholder="Rangoli ${i} name">`;
    }

    function saveNames(){
      const names = [];
      for(let i=1; i<=9; i++){
        const val = document.getElementById('rangoli'+i).value.trim() || "Rangoli " + i;
        names.push({name: val, votes: 0});
      }
      localStorage.setItem('rangolis', JSON.stringify(names));
      window.location.href = 'voting.html';
    }
  </script>
</body>
</html>
