<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rangoli Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffb347, #ffcc33);
      color: #333;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      padding: 20px;
      background: rgba(255,255,255,0.3);
      width: 100%;
      animation: fadeInDown 1s ease;
    }
    h1 { margin: 0; color: #b22222; }
    h3 { margin: 5px 0 15px; color: #fff; }
    .results-container {
      margin: 30px auto;
      width: 90%;
      max-width: 600px;
      animation: fadeIn 1s ease;
    }
    .rank-card {
      background: rgba(255,255,255,0.8);
      border-radius: 15px;
      padding: 15px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      transform: translateY(20px);
      opacity: 0;
      animation: slideIn 0.5s forwards;
    }
    .winner {
      background: #ffd700;
      color: #b22222;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 0 0 25px rgba(255,215,0,0.8);
    }
    footer { margin-top: 20px; font-size: 13px; color: #fff; }
    canvas { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; }

    .actions { margin: 20px 0; }
    #restartBtn {
      background: #ff6600;
      color: #fff;
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #restartBtn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

    @keyframes fadeIn { from {opacity:0} to {opacity:1} }
    @keyframes fadeInDown { from {opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);} }
    @keyframes slideIn { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }
  </style>
</head>
<body>
  <header>
    <img src="hmm.png" width="70" style="border-radius:50%; opacity:0.9;">
    <h1>Annie Besant National School</h1>
    <h3>🏆 Rangoli Competition Results 2025 🏆</h3>
  </header>

  <div class="results-container" id="results"></div>

  <div class="actions">
    <button id="restartBtn">🔄 Restart Competition</button>
  </div>

  <footer>Powered by ARYAN</footer>
  <canvas id="confetti"></canvas>

  <script>
    const rangolis = JSON.parse(localStorage.getItem('rangolis')) || [];
    const resultsDiv = document.getElementById('results');
    rangolis.sort((a,b)=>b.votes - a.votes);
    rangolis.forEach((r, i)=>{
      const card = document.createElement('div');
      card.className = 'rank-card';
      if(i===0) card.classList.add('winner');
      card.style.animationDelay = (i*0.2)+"s";
      card.innerHTML = `<span>${i+1}. ${r.name}</span> <span>${r.votes} votes</span>`;
      resultsDiv.appendChild(card);
    });
    document.getElementById('restartBtn').onclick = ()=>{
      rangolis.forEach(r=>r.votes=0);
      localStorage.setItem('rangolis', JSON.stringify(rangolis));
      window.location.href='setup.html';
    };

    // Confetti
    const canvas=document.getElementById('confetti');
    const ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth; canvas.height=window.innerHeight;
    const pieces=[], colors=['#ff0a54','#ff477e','#ff7096','#ff85a1','#fbb1b8','#f9bec7'];
    for(let i=0;i<150;i++){
      pieces.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,r:Math.random()*6+4,d:Math.random()*10+2,color:colors[Math.floor(Math.random()*colors.length)],tilt:Math.random()*10-10,ta:0,ti:Math.random()*0.07+0.05});
    }
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(const p of pieces){
        ctx.beginPath(); ctx.lineWidth=p.r/2; ctx.strokeStyle=p.color;
        ctx.moveTo(p.x+p.tilt+p.r/4,p.y);
        ctx.lineTo(p.x+p.tilt,p.y+p.tilt+p.r/4);
        ctx.stroke();
        p.ta+=p.ti; p.y+=(Math.cos(p.d)+3+p.r/2)/2; p.tilt=Math.sin(p.ta)*15;
        if(p.y>canvas.height){p.y=-10; p.x=Math.random()*canvas.width;}
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
