<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rangoli Voting</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9966, #ff5e62);
      margin: 0;
      min-height: 100vh;
      color: #fff;
      text-align: center;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px;
      background: rgba(0,0,0,0.4);
      animation: fadeInDown 1s ease;
    }
    h1 { margin: 0; color: #fff; }
    h3 { margin: 5px 0 15px; color: #ffd700; }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
      animation: fadeIn 1s ease;
      flex-grow: 1;
    }
    .card {
      background: rgba(255,255,255,0.15);
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .vote-btn {
      background: #ffd700;
      color: #b22222;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s, opacity 0.3s;
      margin-top: 10px;
    }
    .vote-btn:hover { 
      transform: scale(1.05);
      background: #ffcc00;
    }
    .vote-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: scale(1);
    }
    .votes-count {
      margin-top: 8px;
      font-weight: 600;
      color: #fff;
      font-size: 16px;
    }
    .actions {
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      animation: fadeInUp 1s ease;
    }
    .actions button {
      width: 200px;
      font-size: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .actions button:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.3);}
    #nextVoterBtn { background: #fff; color: #b22222; }
    #resultsBtn { background: #ffd700; color: #b22222; }
    footer {
      margin-top: 10px;
      font-size: 13px;
      color: #fff;
      animation: fadeIn 1s ease;
    }

    /* Animations */
    @keyframes fadeIn { from {opacity:0} to {opacity:1} }
    @keyframes fadeInDown { from {opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);} }
    @keyframes fadeInUp { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }
  </style>
</head>
<body>
  <header>
    <img src="hmm.png" width="70" style="border-radius:50%; opacity:0.9;">
    <h1>Annie Besant National School</h1>
    <h3>Rangoli Competition Voting</h3>
  </header>

  <div class="container" id="rangoliList"></div>

  <div class="actions">
    <button id="nextVoterBtn" onclick="nextVoter()">Next Voter</button>
    <button id="resultsBtn" onclick="endVoting()">View Results</button>
  </div>

  <footer>Powered by ARYAN</footer>

  <script>
    let rangolis = JSON.parse(localStorage.getItem('rangolis')) || [];
    let hasVoted = false;
    const list = document.getElementById('rangoliList');
    const nextBtn = document.getElementById('nextVoterBtn');

    function renderList(){
      list.innerHTML = '';
      rangolis.forEach((r, i)=>{
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h2>${r.name}</h2>
          <button class="vote-btn" onclick="vote(${i})" ${hasVoted ? 'disabled' : ''}>Vote</button>
          <div class="votes-count">Votes: ${r.votes}</div>
        `;
        list.appendChild(card);
      });
    }

    function vote(i){
      if(hasVoted) return;
      rangolis[i].votes++;
      hasVoted = true;
      localStorage.setItem('rangolis', JSON.stringify(rangolis));
      renderList();
    }

    function nextVoter(){
      hasVoted = false;
      renderList();
      nextBtn.classList.add('pulse');
      setTimeout(()=> nextBtn.classList.remove('pulse'), 500);
    }

    function endVoting(){
      window.location.href = 'results.html';
    }

    renderList();
  </script>
</body>
</html>
